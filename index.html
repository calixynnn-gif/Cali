<!DOCTYPE html>
<html>
<head>
    <title>Cali</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(circle at center, #10251d, #030605 65%, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        /* MAIN MONITOR */

        .monitor {
            position: relative;
            width: min(94vw, 1100px);
            height: min(88vh, 620px);

            background: #06100c;
            border: clamp(2px, .3vw, 4px) solid #1b382c;
            border-radius: clamp(12px, 2vw, 22px);

            overflow: hidden;

            box-shadow:
                0 0 25px rgba(0,255,136,.35),
                inset 0 0 60px rgba(0,255,136,.05);
        }

        /* GRID */

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(rgba(0,255,136,.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,.07) 1px, transparent 1px);

            background-size: clamp(20px, 3vw, 38px)
                             clamp(20px, 3vw, 38px);
        }

        /* HEADER */

        .header {
            position: absolute;
            top: 4%;
            left: 3%;

            color: #00ff88;

            font-size: clamp(11px, 1.5vw, 20px);

            letter-spacing: clamp(1px, .3vw, 4px);

            text-shadow: 0 0 10px #00ff88;
        }

        .live {
            color: #ff3158;
            margin-left: 10px;
            animation: blink 2s infinite;
        }

        /* BPM */

        .bpm {
            position: absolute;

            top: 3%;
            right: 3%;

            text-align: right;
            color: #00ff88;
        }

        .bpm-number {
            font-size: clamp(28px, 5vw, 55px);
            font-weight: bold;

            text-shadow:
                0 0 10px #00ff88,
                0 0 20px #00ff88;
        }

        .bpm-label {
            color: #608578;
            font-size: clamp(9px, 1.2vw, 14px);
        }

        /* HEART */

        .heart {
            position: absolute;

            top: 22%;
            left: 50%;

            transform: translateX(-50%);

            font-family: Arial, sans-serif;

            font-size: clamp(65px, 10vw, 120px);

            color: #ff1744;

            text-shadow:
                0 0 10px #ff1744,
                0 0 30px #ff1744,
                0 0 60px #ff1744;

            animation: slowBeat 2.4s infinite;

            z-index: 5;
        }

        /* SLOW HEARTBEAT */

        @keyframes slowBeat {

            0% {
                transform: translateX(-50%) scale(1);
            }

            18% {
                transform: translateX(-50%) scale(1.13);
            }

            27% {
                transform: translateX(-50%) scale(1);
            }

            38% {
                transform: translateX(-50%) scale(1.09);
            }

            48% {
                transform: translateX(-50%) scale(1);
            }

            100% {
                transform: translateX(-50%) scale(1);
            }
        }

        /* ECG AREA */

        .ecg-box {
            position: absolute;

            left: 0;
            right: 0;

            bottom: 20%;
            height: 27%;

            overflow: hidden;
        }

        .ecg {
            width: 200%;
            height: 100%;

            animation: ecgMove 4.8s linear infinite;
        }

        .line {
            fill: none;

            stroke: #00ff88;

            stroke-width: 3;

            filter:
                drop-shadow(0 0 5px #00ff88)
                drop-shadow(0 0 10px #00ff88);
        }

        @keyframes ecgMove {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        /* PATIENT */

        .patient {
            position: absolute;

            bottom: 4%;
            left: 3%;

            color: #00ff88;

            font-size: clamp(9px, 1.2vw, 14px);

            line-height: 1.7;
        }

        .label {
            color: #55786a;
        }

        /* STATUS */

        .status {
            position: absolute;

            bottom: 4%;
            right: 3%;

            text-align: right;

            color: #00ff88;

            font-size: clamp(8px, 1.1vw, 13px);

            line-height: 1.7;
        }

        .dot {
            display: inline-block;

            width: clamp(6px, 1vw, 10px);
            height: clamp(6px, 1vw, 10px);

            background: #00ff88;

            border-radius: 50%;

            box-shadow: 0 0 10px #00ff88;

            animation: blink 2s infinite;
        }

        @keyframes blink {
            50% {
                opacity: .2;
            }
        }

        /* PHONE */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .monitor {
                width: 100%;
                height: 88vh;

                border-radius: 14px;
            }

            .header {
                top: 4%;
                left: 5%;
            }

            .bpm {
                top: 4%;
                right: 5%;
            }

            .heart {
                top: 24%;
            }

            .ecg-box {
                bottom: 23%;
                height: 22%;
            }

            .patient {
                left: 5%;
                bottom: 5%;
            }

            .status {
                right: 5%;
                bottom: 5%;
            }
        }

        /* SMALL PHONE */

        @media (max-width: 380px) {

            .monitor {
                height: 90vh;
            }

            .heart {
                top: 25%;
                font-size: 65px;
            }

            .ecg-box {
                bottom: 25%;
                height: 20%;
            }

            .status {
                display: none;
            }
        }

        /* LAPTOP / PC */

        @media (min-width: 1000px) {

            .monitor {
                width: min(90vw, 1200px);
                height: min(86vh, 680px);
            }

            .heart {
                top: 20%;
            }

            .ecg-box {
                height: 28%;
                bottom: 19%;
            }
        }
    </style>
</head>

<body>

    <div class="monitor">

        <div class="grid"></div>

        <div class="header">
            ♥ CARDIAC MONITOR
            <span class="live">● LIVE</span>
        </div>

        <div class="bpm">
            <div class="bpm-number" id="bpm">72</div>
            <div class="bpm-label">BPM</div>
        </div>

        <div class="heart">
            ♥
        </div>

        <div class="ecg-box">

            <svg class="ecg"
                 viewBox="0 0 1200 150"
                 preserveAspectRatio="none">

                <polyline class="line"
                    points="
                    0,75
                    100,75
                    160,75
                    180,75
                    195,35
                    210,115
                    225,75
                    300,75
                    380,75
                    450,75
                    510,75
                    530,75
                    545,35
                    560,115
                    575,75
                    650,75
                    730,75
                    800,75
                    860,75
                    880,75
                    895,35
                    910,115
                    925,75
                    1000,75
                    1100,75
                    1200,75
                    ">
                </polyline>

                <polyline class="line"
                    points="
                    1200,75
                    1300,75
                    1360,75
                    1380,75
                    1395,35
                    1410,115
                    1425,75
                    1500,75
                    1580,75
                    1650,75
                    1710,75
                    1730,75
                    1745,35
                    1760,115
                    1775,75
                    1850,75
                    1930,75
                    2000,75
                    2060,75
                    2080,75
                    2095,35
                    2110,115
                    2125,75
                    2200,75
                    2300,75
                    2400,75
                    ">
                </polyline>

            </svg>

        </div>

        <div class="patient">
            <span class="label">PATIENT:</span> CALI<br>
            <span class="label">RHYTHM:</span> SINUS<br>
            <span class="label">STATUS:</span> STABLE
        </div>

        <div class="status">
            <span class="dot"></span>
            SYSTEM ONLINE<br>
            MONITORING ACTIVE
        </div>

    </div>

    <script>

        const bpm = document.getElementById("bpm");

        setInterval(() => {

            let value = 70 + Math.floor(Math.random() * 6);

            bpm.textContent = value;

        }, 2400);

    </script>

</body>
</html>
