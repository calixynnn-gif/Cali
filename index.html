<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cali - Glowing Garden</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            ellipse at center bottom,
            #180a02 0%,
            #070302 45%,
            #000 100%
        );
    font-family: cursive;
}


/* STAR FIELD */
.stars,
.stars::before,
.stars::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
}

.stars {
    z-index: 1;
    overflow: hidden;
    background-image:
        radial-gradient(circle at 8% 18%, rgba(255,255,220,.95) 0 1px, transparent 1.7px),
        radial-gradient(circle at 18% 42%, rgba(255,215,130,.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 29% 12%, rgba(255,255,255,.9) 0 1px, transparent 1.8px),
        radial-gradient(circle at 41% 31%, rgba(255,230,160,.85) 0 1.3px, transparent 2px),
        radial-gradient(circle at 53% 9%, rgba(255,255,255,.9) 0 1px, transparent 1.8px),
        radial-gradient(circle at 64% 23%, rgba(255,220,150,.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 76% 11%, rgba(255,255,255,.95) 0 1px, transparent 1.8px),
        radial-gradient(circle at 88% 28%, rgba(255,230,170,.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 95% 8%, rgba(255,255,255,.9) 0 1px, transparent 1.8px);
    opacity: .85;
    animation: starsTwinkle 4s ease-in-out infinite;
}

.stars::before {
    background-image:
        radial-gradient(circle at 5% 58%, rgba(255,255,255,.75) 0 1px, transparent 1.8px),
        radial-gradient(circle at 15% 76%, rgba(255,220,140,.75) 0 1px, transparent 1.8px),
        radial-gradient(circle at 34% 67%, rgba(255,255,255,.8) 0 1.1px, transparent 2px),
        radial-gradient(circle at 48% 53%, rgba(255,225,150,.75) 0 1px, transparent 1.8px),
        radial-gradient(circle at 61% 72%, rgba(255,255,255,.8) 0 1px, transparent 1.8px),
        radial-gradient(circle at 73% 54%, rgba(255,220,140,.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 84% 70%, rgba(255,255,255,.8) 0 1px, transparent 1.8px),
        radial-gradient(circle at 98% 60%, rgba(255,230,160,.75) 0 1px, transparent 1.8px);
    transform: scale(1.25);
    opacity: .7;
    animation: starDrift 12s linear infinite;
}

.stars::after {
    background:
        radial-gradient(circle at 22% 25%, rgba(255,190,60,.12), transparent 18%),
        radial-gradient(circle at 78% 35%, rgba(255,130,30,.10), transparent 20%);
    filter: blur(10px);
}

@keyframes starsTwinkle {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
}

@keyframes starDrift {
    from { transform: scale(1.25) translateY(0); }
    to { transform: scale(1.25) translateY(-2vh); }
}

/* Tiny glowing star-crosses for extra magic */
.star-cross {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fffbd0;
    box-shadow: 0 0 5px #fff, 0 0 14px #ffc400;
    z-index: 2;
    animation: starPulse 2.8s ease-in-out infinite;
}
.star-cross::before,
.star-cross::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,240,170,.8);
}
.star-cross::before { width: 18px; height: 1px; }
.star-cross::after { width: 1px; height: 18px; }

@keyframes starPulse {
    0%,100% { transform: scale(.65); opacity: .35; }
    50% { transform: scale(1.15); opacity: 1; }
}

/* BACKGROUND LIGHT */

.background-glow {
    position: absolute;
    width: 60vw;
    height: 30vh;
    left: 50%;
    bottom: -10vh;
    transform: translateX(-50%);
    background: #ff4b00;
    filter: blur(10vw);
    opacity: .12;
}

/* CALI */

.name {
    position: absolute;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);

    font-size: clamp(55px, 9vw, 125px);
    font-weight: bold;
    font-style: italic;
    letter-spacing: clamp(3px, .7vw, 10px);

    color: #fff5a3;
    white-space: nowrap;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #ffd000,
        0 0 30px #ff8c00,
        0 0 60px #ff4b00,
        0 0 100px #ff3000;

    animation: nameGlow 2.5s ease-in-out infinite;

    z-index: 30;
}

@keyframes nameGlow {
    0%,100% {
        filter: brightness(.9);
    }

    50% {
        filter: brightness(1.4);
    }
}

/* MAGIC ENERGY */

.vine {
    position: absolute;
    top: 19vh;
    left: 50%;

    width: clamp(1px, .25vw, 3px);
    height: 43vh;

    background: linear-gradient(
        to bottom,
        #fff36b,
        #ff8700,
        transparent
    );

    filter:
        drop-shadow(0 0 5px #ffcf00)
        drop-shadow(0 0 15px #ff5a00);

    opacity: .8;
    z-index: 5;

    transform-origin: top;
}

.vine1 {
    transform: rotate(-25deg);
}

.vine2 {
    transform: rotate(25deg);
}

.vine3 {
    transform: rotate(-10deg);
}

.vine4 {
    transform: rotate(10deg);
}

/* ENERGY PARTICLES */

.energy {
    position: absolute;

    width: clamp(4px, .5vw, 8px);
    height: clamp(4px, .5vw, 8px);

    border-radius: 50%;
    background: #fff8a0;

    box-shadow:
        0 0 8px white,
        0 0 20px #ffb000,
        0 0 35px #ff4b00;

    animation: energyMove 3s linear infinite;

    z-index: 20;
}

@keyframes energyMove {
    0% {
        transform: translateY(0) scale(.4);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        transform: translateY(42vh) scale(1.3);
        opacity: 0;
    }
}

/* FLOWER */

.flower {
    position: absolute;

    width: clamp(75px, 9vw, 135px);
    height: clamp(280px, 48vh, 470px);

    bottom: -5vh;

    transform-origin: bottom center;

    animation: sway 5s ease-in-out infinite;

    z-index: 10;
}

@keyframes sway {
    0%,100% {
        rotate: -2deg;
    }

    50% {
        rotate: 2deg;
    }
}

/* STEM */

.stem {
    position: absolute;

    width: clamp(3px, .35vw, 6px);
    height: 80%;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    background: linear-gradient(
        to right,
        #351004,
        #ff4b08,
        #5a1604
    );

    box-shadow:
        0 0 8px #ff4b08,
        0 0 20px #ff3900;
}

/* LEAVES */

.leaf {
    position: absolute;

    width: clamp(30px, 4vw, 55px);
    height: clamp(13px, 1.7vw, 23px);

    background: linear-gradient(
        90deg,
        #421406,
        #e34b0a
    );

    border-radius: 100% 0 100% 0;

    box-shadow:
        0 0 8px #ff4b08,
        0 0 18px #ff3500;
}

.left {
    left: 5%;
    transform: rotate(-30deg);
}

.right {
    right: 5%;
    transform: rotate(30deg) scaleX(-1);
}

.l1 { bottom: 16%; }
.l2 { bottom: 26%; }
.l3 { bottom: 36%; }
.l4 { bottom: 46%; }
.l5 { bottom: 56%; }

/* FLOWER HEAD */

.head {
    position: absolute;

    width: 100%;
    aspect-ratio: 1;

    left: 0;
    bottom: 73%;
}

/* PETALS */

.petal {
    position: absolute;

    width: 34%;
    height: 55%;

    left: 33%;
    top: 23%;

    border-radius: 50% 50% 45% 45%;

    background: linear-gradient(
        to bottom,
        #ff8700,
        #ff3b00
    );

    transform-origin: 50% 100%;

    box-shadow:
        0 0 10px #ff6500,
        0 0 25px #ff4200,
        0 0 50px #ff2500;

    animation: petalGlow 2s ease-in-out infinite;
}

@keyframes petalGlow {
    0%,100% {
        filter: brightness(.9);
    }

    50% {
        filter: brightness(1.4);
    }
}

.p1 { transform: rotate(0deg); }
.p2 { transform: rotate(45deg); }
.p3 { transform: rotate(90deg); }
.p4 { transform: rotate(135deg); }
.p5 { transform: rotate(180deg); }
.p6 { transform: rotate(225deg); }
.p7 { transform: rotate(270deg); }
.p8 { transform: rotate(315deg); }

/* CENTER */

.center {
    position: absolute;

    width: 35%;
    aspect-ratio: 1;

    left: 32.5%;
    top: 33%;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        #fff 0%,
        #fff36a 30%,
        #ffb000 65%,
        #ff4b00 100%
    );

    z-index: 10;

    box-shadow:
        0 0 10px white,
        0 0 25px #fff000,
        0 0 50px #ff9d00,
        0 0 80px #ff4500;

    animation: centerPulse 1.8s infinite;
}

@keyframes centerPulse {
    0%,100% {
        scale: .9;
    }

    50% {
        scale: 1.15;
    }
}

/* SPARKS */

.spark {
    position: absolute;

    width: clamp(3px, .4vw, 6px);
    height: clamp(3px, .4vw, 6px);

    border-radius: 50%;

    background: #ffd36b;

    box-shadow:
        0 0 10px #ff8c00,
        0 0 25px #ff4500;

    animation: float 5s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        transform: translateY(-45vh);
        opacity: 0;
    }
}

/* =========================
   DEFAULT = PC / LAPTOP
========================= */

.leftFlower {
    left: 22%;
}

.centerFlower {
    left: 50%;
    transform: translateX(-50%);
}

.rightFlower {
    right: 22%;
}

.smallFlower {
    transform: scale(.8);
}

/* =========================
   PHONE SETUP
   768px and below = phone
========================= */

@media screen and (max-width: 768px) {

    .name {
        top: 5vh;
        font-size: clamp(40px, 15vw, 80px);
        letter-spacing: 2px;
    }

    .vine {
        top: 20vh;
        height: 35vh;
    }

    .flower {
        width: 22vw;
        height: 45vh;
        bottom: -5vh;
    }

    .leftFlower {
        left: 3vw;
    }

    .centerFlower {
        left: 50%;
        transform: translateX(-50%);
    }

    .rightFlower {
        right: 3vw;
    }

    .smallFlower {
        transform: scale(.6);
    }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media screen and (max-width: 380px) {

    .name {
        font-size: 18vw;
        top: 5vh;
    }

    .flower {
        width: 25vw;
        height: 45vh;
    }

    .flower.centerFlower {
        width: 30vw;
    }

    .smallFlower {
        display: none;
    }
}

/* =========================
   LARGE PC / LAPTOP
========================= */

@media screen and (min-width: 1200px) {

    .flower {
        width: 10vw;
        max-width: 150px;
    }

    .name {
        font-size: 8vw;
    }
}

</style>
</head>

<body>


<div class="stars"></div>
<div class="star-cross" style="left:14%;top:22%;animation-delay:.2s"></div>
<div class="star-cross" style="left:31%;top:16%;animation-delay:1.1s"></div>
<div class="star-cross" style="left:70%;top:17%;animation-delay:.7s"></div>
<div class="star-cross" style="left:86%;top:39%;animation-delay:1.8s"></div>
<div class="star-cross" style="left:9%;top:48%;animation-delay:1.4s"></div>
<div class="star-cross" style="left:92%;top:72%;animation-delay:.5s"></div>

<div class="background-glow"></div>

<div class="name">Cali</div>

<!-- MAGICAL ENERGY -->
<div class="vine vine1"></div>
<div class="vine vine2"></div>
<div class="vine vine3"></div>
<div class="vine vine4"></div>

<div class="energy" style="left:48%;top:18vh;animation-delay:0s"></div>
<div class="energy" style="left:52%;top:20vh;animation-delay:.7s"></div>
<div class="energy" style="left:45%;top:19vh;animation-delay:1.3s"></div>
<div class="energy" style="left:56%;top:20vh;animation-delay:2s"></div>


<!-- LEFT FLOWER -->

<div class="flower leftFlower"
     style="left:22%;animation-delay:.5s">

    <div class="stem"></div>

    <div class="leaf left l1"></div>
    <div class="leaf right l2"></div>
    <div class="leaf left l3"></div>
    <div class="leaf right l4"></div>
    <div class="leaf left l5"></div>

    <div class="head">

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>

        <div class="center"></div>

    </div>
</div>


<!-- CENTER FLOWER -->

<div class="flower centerFlower"
     style="animation-delay:1s">

    <div class="stem"></div>

    <div class="leaf left l1"></div>
    <div class="leaf right l2"></div>
    <div class="leaf left l3"></div>
    <div class="leaf right l4"></div>
    <div class="leaf left l5"></div>

    <div class="head">

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>

        <div class="center"></div>

    </div>
</div>


<!-- RIGHT FLOWER -->

<div class="flower rightFlower"
     style="right:22%;animation-delay:1.5s">

    <div class="stem"></div>

    <div class="leaf left l1"></div>
    <div class="leaf right l2"></div>
    <div class="leaf left l3"></div>
    <div class="leaf right l4"></div>
    <div class="leaf left l5"></div>

    <div class="head">

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>

        <div class="center"></div>

    </div>
</div>


<!-- SMALL FLOWERS -->

<div class="flower smallFlower"
     style="left:2%;bottom:-7vh;animation-delay:2s">

    <div class="stem"></div>

    <div class="leaf left l1"></div>
    <div class="leaf right l2"></div>

    <div class="head">

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>

        <div class="center"></div>

    </div>
</div>


<div class="flower smallFlower"
     style="right:2%;bottom:-7vh;animation-delay:2.5s">

    <div class="stem"></div>

    <div class="leaf left l1"></div>
    <div class="leaf right l2"></div>

    <div class="head">

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>

        <div class="center"></div>

    </div>
</div>


<!-- FLOATING SPARKS -->

<div class="spark" style="left:12%;top:80%;animation-delay:0s"></div>
<div class="spark" style="left:25%;top:70%;animation-delay:1s"></div>
<div class="spark" style="left:38%;top:85%;animation-delay:2s"></div>
<div class="spark" style="left:52%;top:75%;animation-delay:.5s"></div>
<div class="spark" style="left:66%;top:85%;animation-delay:2.5s"></div>

<div class="spark" style="left:90%;top:82%;animation-delay:3s"></div>

</body>
