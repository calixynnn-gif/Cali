<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Universe ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #02010a;
    font-family: "Times New Roman", serif;
    color: white;
    height: 100vh;
}

/* SPACE */
.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 50%, #171044 0%, #08051d 45%, #010106 100%);
}

/* STARS */
.stars,
.stars2,
.stars3 {
    position: absolute;
    inset: 0;
    background-repeat: repeat;
    pointer-events: none;
}

.stars {
    background-image:
        radial-gradient(2px 2px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 20% 70%, white, transparent),
        radial-gradient(2px 2px at 35% 30%, white, transparent),
        radial-gradient(1px 1px at 50% 80%, white, transparent),
        radial-gradient(2px 2px at 70% 25%, white, transparent),
        radial-gradient(1px 1px at 85% 65%, white, transparent),
        radial-gradient(2px 2px at 95% 15%, white, transparent);
    animation: starsMove 15s linear infinite;
}

.stars2 {
    opacity: .6;
    transform: scale(1.5);
    background-image:
        radial-gradient(1px 1px at 15% 40%, #bda7ff, transparent),
        radial-gradient(2px 2px at 45% 15%, #fff, transparent),
        radial-gradient(1px 1px at 65% 55%, #bda7ff, transparent),
        radial-gradient(2px 2px at 90% 75%, #fff, transparent);
    animation: starsMove 25s linear infinite reverse;
}

.stars3 {
    opacity: .4;
    transform: scale(2);
    background-image:
        radial-gradient(1px 1px at 25% 15%, #ffb6ed, transparent),
        radial-gradient(1px 1px at 75% 30%, #a9d9ff, transparent),
        radial-gradient(2px 2px at 40% 90%, white, transparent);
    animation: starsMove 35s linear infinite;
}

@keyframes starsMove {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-100px);
    }
}

/* NEBULA */
.nebula {
    position: absolute;
    width: 800px;
    height: 500px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(ellipse, rgba(163, 75, 255, .18), transparent 60%);
    filter: blur(35px);
}

/* SOLAR SYSTEM */
.solar-system {
    position: absolute;
    width: 700px;
    height: 700px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* SUN */
.sun {
    position: absolute;
    width: 90px;
    height: 90px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;

    background: radial-gradient(
        circle at 35% 35%,
        #fff,
        #ffd1fa 20%,
        #ff7ee8 45%,
        #a92cff 75%
    );

    box-shadow:
        0 0 25px #ff9af2,
        0 0 60px #c83cff,
        0 0 120px rgba(184, 46, 255, .6);

    animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        box-shadow:
            0 0 25px #ff9af2,
            0 0 60px #c83cff,
            0 0 120px rgba(184,46,255,.5);
    }

    50% {
        box-shadow:
            0 0 35px #fff,
            0 0 80px #ff63df,
            0 0 150px rgba(184,46,255,.8);
    }
}

/* ORBITS */
.orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    border: 1px solid rgba(190, 130, 255, .25);
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

.orbit1 {
    width: 170px;
    height: 170px;
}

.orbit2 {
    width: 270px;
    height: 270px;
}

.orbit3 {
    width: 390px;
    height: 390px;
}

.orbit4 {
    width: 520px;
    height: 520px;
}

.orbit5 {
    width: 650px;
    height: 650px;
}

/* PLANETS */
.planet {
    position: absolute;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform-origin: center;
}

/* Planet 1 */
.planet1 {
    width: 14px;
    height: 14px;
    background: #ffb27d;
    box-shadow: 0 0 15px #ff8c5c;

    animation: orbit1 7s linear infinite;
}

@keyframes orbit1 {
    from {
        transform: rotate(0deg) translateX(85px);
    }
    to {
        transform: rotate(360deg) translateX(85px);
    }
}

/* Planet 2 */
.planet2 {
    width: 22px;
    height: 22px;
    background: linear-gradient(135deg, #ffe3a1, #d88b4a);
    box-shadow: 0 0 15px #ffc36b;

    animation: orbit2 11s linear infinite;
}

@keyframes orbit2 {
    from {
        transform: rotate(0deg) translateX(135px);
    }
    to {
        transform: rotate(360deg) translateX(135px);
    }
}

/* Earth */
.planet3 {
    width: 28px;
    height: 28px;

    background:
        radial-gradient(circle at 35% 30%, #62e6ff, #1674d1 50%, #08235e);

    box-shadow:
        0 0 15px #4ddaff,
        0 0 30px rgba(42, 180, 255, .5);

    animation: orbit3 17s linear infinite;
}

@keyframes orbit3 {
    from {
        transform: rotate(0deg) translateX(195px);
    }
    to {
        transform: rotate(360deg) translateX(195px);
    }
}

/* Saturn */
.planet4 {
    width: 42px;
    height: 42px;

    background: radial-gradient(
        circle at 30% 30%,
        #ffe6a5,
        #bd7e48 60%,
        #63391f
    );

    box-shadow: 0 0 20px rgba(255,190,110,.7);

    animation: orbit4 25s linear infinite;
}

/* Saturn Ring */
.planet4::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 20px;
    border: 3px solid rgba(255, 221, 159, .7);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
}

@keyframes orbit4 {
    from {
        transform: rotate(0deg) translateX(260px);
    }
    to {
        transform: rotate(360deg) translateX(260px);
    }
}

/* BIG PLANET */
.planet5 {
    width: 55px;
    height: 55px;

    background:
        repeating-linear-gradient(
            0deg,
            #d98a63 0px,
            #d98a63 6px,
            #8b4a68 7px,
            #5e367f 12px
        );

    box-shadow:
        0 0 20px #9f6cff,
        0 0 40px rgba(128, 80, 255, .5);

    animation: orbit5 34s linear infinite;
}

@keyframes orbit5 {
    from {
        transform: rotate(0deg) translateX(325px);
    }
    to {
        transform: rotate(360deg) translateX(325px);
    }
}

/* CENTER TEXT */
.content {
    position: absolute;
    z-index: 10;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    width: 90%;
    max-width: 700px;

    pointer-events: none;
}

.small-title {
    font-size: 18px;
    letter-spacing: 8px;
    text-transform: uppercase;
    opacity: .8;

    text-shadow: 0 0 15px #d99aff;
}

h1 {
    margin-top: 8px;

    font-size: clamp(55px, 10vw, 110px);

    font-weight: normal;

    font-style: italic;

    color: #fff;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff9be8,
        0 0 50px #b64dff,
        0 0 90px #873cff;
}

.heart {
    font-size: 35px;
    margin: 10px 0;

    color: #ff9de9;

    text-shadow:
        0 0 10px #ff9de9,
        0 0 30px #ff4fce;

    animation: heartBeat 1.5s infinite;
}

@keyframes heartBeat {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }
}

.message {
    font-size: 18px;
    letter-spacing: 3px;
    opacity: .8;
}

/* CALI METEOR */
.meteor {
    position: absolute;
    z-index: 20;

    top: 18%;
    left: -200px;

    width: 180px;
    height: 3px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.3),
        white
    );

    transform: rotate(-20deg);

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 15px #d783ff);

    animation: meteorMove 7s linear infinite;
}

.meteor::before {
    content: "CALI";

    position: absolute;

    right: 20px;
    top: -30px;

    font-family: "Times New Roman", serif;

    font-size: 22px;
    font-weight: bold;

    letter-spacing: 5px;

    color: white;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff8ee8,
        0 0 30px #9c5cff;
}

.meteor::after {
    content: "";

    position: absolute;

    right: 0;
    top: -4px;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 25px #ffb3ef,
        0 0 45px #a85cff;
}

@keyframes meteorMove {
    0% {
        left: -250px;
        top: 15%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    60% {
        opacity: 1;
    }

    100% {
        left: 120%;
        top: 75%;
        opacity: 0;
    }
}

/* SECOND METEOR */
.meteor2 {
    top: 5%;
    left: -300px;
    animation-delay: 4s;
    animation-duration: 9s;
    transform: rotate(25deg) scale(.7);
}

/* FLOATING HEARTS */
.floating-heart {
    position: absolute;
    z-index: 5;

    color: rgba(255, 159, 235, .7);

    font-size: 18px;

    animation: floatHeart 8s linear infinite;
}

.heart1 {
    left: 15%;
    bottom: -30px;
    animation-delay: 1s;
}

.heart2 {
    left: 80%;
    bottom: -30px;
    animation-delay: 4s;
}

.heart3 {
    left: 45%;
    bottom: -30px;
    animation-delay: 6s;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) scale(.7);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-100vh) scale(1.4) rotate(30deg);
        opacity: 0;
    }
}

/* MOBILE */
@media (max-width: 600px) {

    .solar-system {
        width: 500px;
        height: 500px;
    }

    .orbit1 {
        width: 120px;
        height: 120px;
    }

    .orbit2 {
        width: 190px;
        height: 190px;
    }

    .orbit3 {
        width: 270px;
        height: 270px;
    }

    .orbit4 {
        width: 360px;
        height: 360px;
    }

    .orbit5 {
        width: 450px;
        height: 450px;
    }

    .small-title {
        font-size: 12px;
        letter-spacing: 5px;
    }

    h1 {
        font-size: 60px;
    }

    .message {
        font-size: 14px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="space">

    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <div class="nebula"></div>

    <!-- SOLAR SYSTEM -->
    <div class="solar-system">

        <div class="orbit orbit1"></div>
        <div class="orbit orbit2"></div>
        <div class="orbit orbit3"></div>
        <div class="orbit orbit4"></div>
        <div class="orbit orbit5"></div>

        <div class="sun"></div>

        <div class="planet planet1"></div>
        <div class="planet planet2"></div>
        <div class="planet planet3"></div>
        <div class="planet planet4"></div>
        <div class="planet planet5"></div>

    </div>

    <!-- CALI METEORS -->
    <div class="meteor"></div>
    <div class="meteor meteor2"></div>
    <div class="meteor meteor3"></div>

    <!-- ROMANTIC CENTER -->
    <div class="content">

        <div class="small-title">
            written in the stars
        </div>

        <h1>
            Your Universe
        </h1>

        <div class="heart">
            ♥
        </div>

        <div class="message">
            In a universe full of stars,<br>
            you are my favorite.
        </div>

    </div>

    <!-- FLOATING HEARTS -->
    <div class="floating-heart heart1">♥</div>
    <div class="floating-heart heart2">♥</div>
    <div class="floating-heart heart3">♥</div>
    <div class="floating-heart heart1">♥</div>

</div>

</body>
</html>
